[book]
title = "PlayOS Specification"
description = "Architecture, API contracts, component specifications, and delivery plan for PlayOS — a console operating system for the ASUS ROG Ally."
authors = ["PlayOS Contributors"]
language = "en"
multilingual = false
src = "src"

[output.html]
theme = "coal"
default-theme = "coal"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/your-org/playos-spec"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/your-org/playos-spec/edit/main/src/{path}"
additional-css = ["theme/playos.css"]
no-section-label = false

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
